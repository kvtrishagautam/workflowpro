<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Telegram Chat ID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .step {
            background: #f8fafc;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .step-number {
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Monaco', monospace;
            margin: 10px 0;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .result {
            background: #10b981;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .error {
            background: #ef4444;
        }
        code {
            background: rgba(0,0,0,0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'Monaco', monospace;
        }
        .chat-id-display {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            font-family: 'Monaco', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Get Your Telegram Chat ID</h1>

        <div class="step">
            <span class="step-number">1</span>
            <strong>Message your bot first</strong>
            <p style="margin-top: 10px;">Open Telegram and send any message to your bot (e.g., "Hello")</p>
        </div>

        <div class="step">
            <span class="step-number">2</span>
            <strong>Enter your bot token below</strong>
            <input type="text" id="botToken" placeholder="123456789:ABCdefGhIJKlmnoPQRstuVWXyz">
        </div>

        <div class="step">
            <span class="step-number">3</span>
            <strong>Click to get your Chat ID</strong>
            <button onclick="getChatId()">🔍 Get Chat ID</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        async function getChatId() {
            const botToken = document.getElementById('botToken').value.trim();
            const resultDiv = document.getElementById('result');

            if (!botToken) {
                resultDiv.className = 'result error show';
                resultDiv.innerHTML = '❌ Please enter your bot token first';
                return;
            }

            try {
                resultDiv.className = 'result show';
                resultDiv.innerHTML = '⏳ Fetching your chat ID...';

                const response = await fetch(`https://api.telegram.org/bot${botToken}/getUpdates`);
                const data = await response.json();

                if (!data.ok) {
                    throw new Error(data.description || 'Invalid bot token');
                }

                if (data.result.length === 0) {
                    resultDiv.className = 'result error show';
                    resultDiv.innerHTML = `
                        ❌ No messages found!<br><br>
                        <strong>Please:</strong><br>
                        1. Open Telegram<br>
                        2. Send a message to your bot<br>
                        3. Click "Get Chat ID" again
                    `;
                    return;
                }

                const chatId = data.result[0].message.chat.id;
                const firstName = data.result[0].message.chat.first_name || 'User';

                resultDiv.className = 'result show';
                resultDiv.innerHTML = `
                    ✅ <strong>Chat ID Found!</strong><br><br>
                    <strong>Name:</strong> ${firstName}<br>
                    <strong>Chat ID:</strong>
                    <div class="chat-id-display">${chatId}</div>
                    <br>
                    <button onclick="copyChatId('${chatId}')" style="width: auto; padding: 10px 20px;">
                        📋 Copy Chat ID
                    </button>
                    <br><br>
                    <small>Use this Chat ID in your Telegram node configuration</small>
                `;
            } catch (error) {
                resultDiv.className = 'result error show';
                resultDiv.innerHTML = `
                    ❌ <strong>Error:</strong> ${error.message}<br><br>
                    <small>Make sure your bot token is correct and you've messaged the bot</small>
                `;
            }
        }

        function copyChatId(chatId) {
            navigator.clipboard.writeText(chatId);
            alert('✅ Chat ID copied to clipboard!');
        }
    </script>
</body>
</html>
