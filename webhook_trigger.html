<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigger Nathan's Workflow</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #1f2937;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4b5563;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        #status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .success {
            color: #10b981;
        }

        .error {
            color: #ef4444;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>🚀 Trigger Order Workflow</h2>
        <form id="webhookForm">
            <div class="form-group">
                <label for="orderID">Order ID</label>
                <input type="text" id="orderID" name="orderID" value="ORD-999" required>
            </div>
            <div class="form-group">
                <label for="employeeName">Employee Name</label>
                <input type="text" id="employeeName" name="employeeName" value="Nathan Tester" required>
            </div>
            <div class="form-group">
                <label for="orderStatus">Order Status</label>
                <select id="orderStatus" name="orderStatus">
                    <option value="processing">Processing (Needs Review)</option>
                    <option value="booked">Booked (Auto-Approve)</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="form-group">
                <label for="orderPrice">Order Price ($)</label>
                <input type="number" id="orderPrice" name="orderPrice" value="250.00" step="0.01" required>
            </div>
            <button type="submit">Submit Order</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('webhookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = 'Sending...';
            statusDiv.className = '';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            // Convert price to number
            data.orderPrice = parseFloat(data.orderPrice);

            try {
                const response = await fetch('http://localhost:4000/api/webhook/nathans-orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.textContent = '✅ Workflow Triggered Successfully!';
                    statusDiv.className = 'success';
                    console.log(result);
                } else {
                    throw new Error(result.message || 'Failed to trigger');
                }
            } catch (error) {
                statusDiv.textContent = '❌ Error: ' + error.message;
                statusDiv.className = 'error';
            }
        });
    </script>
</body>

</html>
