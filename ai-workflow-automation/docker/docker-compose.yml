version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../backend/src:/app/src
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ../frontend/src:/app/src
    environment:
      - NODE_ENV=development

  shared:
    build:
      context: ../packages/shared
      dockerfile: Dockerfile
    volumes:
      - ../packages/shared/src:/app/src

  node-sdk:
    build:
      context: ../packages/node-sdk
      dockerfile: Dockerfile
    volumes:
      - ../packages/node-sdk/src:/app/src

networks:
  default:
    driver: bridge

volumes:
  backend-data:
  frontend-data: