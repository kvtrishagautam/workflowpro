<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Task Management Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.9em;
            color: #666;
            font-weight: 600;
        }

        input, select, button {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .stat-value {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #666;
            font-size: 1.1em;
            margin-top: 10px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .chart-container h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .task-list {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .task-list h3 {
            color: #333;
            margin-bottom: 20px;
        }

        .task-item {
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .task-item.critical {
            border-left-color: #dc3545;
        }

        .task-item.overdue {
            border-left-color: #fd7e14;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .task-name {
            font-weight: 600;
            color: #333;
        }

        .task-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-critical { background: #dc3545; color: white; }
        .badge-high { background: #fd7e14; color: white; }
        .badge-medium { background: #ffc107; color: #333; }
        .badge-low { background: #28a745; color: white; }

        .task-meta {
            font-size: 0.9em;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.5em;
        }

        .error {
            background: #dc3545;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>📊 Task Management Dashboard</h1>
            <p class="subtitle">Real-time insights from your Google Sheets data</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label>Spreadsheet ID</label>
                <input type="text" id="spreadsheetId" placeholder="Enter your Google Sheet ID" style="width: 400px;">
            </div>
            <div class="control-group">
                <label>Sheet Name</label>
                <input type="text" id="sheetName" value="Sheet1" placeholder="Sheet name">
            </div>
            <div class="control-group">
                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="Google API Key" style="width: 300px;">
            </div>
            <button onclick="loadData()" style="margin-top: 20px;">🔄 Load Data</button>
        </div>

        <div id="content"></div>
    </div>

    <script>
        let taskData = [];
        let charts = {};

        async function loadData() {
            const spreadsheetId = document.getElementById('spreadsheetId').value;
            const sheetName = document.getElementById('sheetName').value;
            const apiKey = document.getElementById('apiKey').value;

            if (!spreadsheetId || !apiKey) {
                alert('Please enter Spreadsheet ID and API Key');
                return;
            }

            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading data...</div>';

            try {
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${sheetName}!A:Z?key=${apiKey}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch data: ${response.statusText}`);
                }

                const data = await response.json();
                const rows = data.values;

                if (!rows || rows.length < 2) {
                    throw new Error('No data found in sheet');
                }

                // Parse data
                const headers = rows[0];
                taskData = rows.slice(1).map(row => ({
                    taskId: row[0],
                    project: row[1],
                    taskName: row[2],
                    owner: row[3],
                    department: row[4],
                    priority: row[5],
                    status: row[6],
                    startDate: row[7],
                    dueDate: row[8],
                    completion: parseInt(row[9]) || 0
                }));

                renderDashboard();
            } catch (error) {
                content.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function renderDashboard() {
            const content = document.getElementById('content');
            
            // Calculate stats
            const totalTasks = taskData.length;
            const completedTasks = taskData.filter(t => t.status === 'Completed').length;
            const inProgressTasks = taskData.filter(t => t.status === 'In Progress').length;
            const criticalTasks = taskData.filter(t => t.priority === 'Critical').length;
            const avgCompletion = Math.round(taskData.reduce((sum, t) => sum + t.completion, 0) / totalTasks);
            
            const overdueTasks = taskData.filter(t => {
                const due = new Date(t.dueDate);
                return due < new Date() && t.status !== 'Completed';
            });

            content.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${totalTasks}</div>
                        <div class="stat-label">Total Tasks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${completedTasks}</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${inProgressTasks}</div>
                        <div class="stat-label">In Progress</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${avgCompletion}%</div>
                        <div class="stat-label">Avg Completion</div>
                    </div>
                </div>

                <div class="charts-grid">
                    <div class="chart-container">
                        <h3>📊 Status Breakdown</h3>
                        <div class="chart-wrapper">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-container">
                        <h3>🎯 Priority Distribution</h3>
                        <div class="chart-wrapper">
                            <canvas id="priorityChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-container">
                        <h3>👥 Workload by Owner</h3>
                        <div class="chart-wrapper">
                            <canvas id="ownerChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-container">
                        <h3>📈 Completion by Project</h3>
                        <div class="chart-wrapper">
                            <canvas id="projectChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="task-list">
                    <h3>⚠️ Critical & Overdue Tasks (${overdueTasks.length + criticalTasks})</h3>
                    <div id="urgentTasks"></div>
                </div>
            `;

            // Render charts
            renderStatusChart();
            renderPriorityChart();
            renderOwnerChart();
            renderProjectChart();
            renderUrgentTasks(overdueTasks);
        }

        function renderStatusChart() {
            const statusCounts = {};
            taskData.forEach(t => {
                statusCounts[t.status] = (statusCounts[t.status] || 0) + 1;
            });

            const ctx = document.getElementById('statusChart').getContext('2d');
            if (charts.status) charts.status.destroy();
            
            charts.status = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(statusCounts),
                    datasets: [{
                        data: Object.values(statusCounts),
                        backgroundColor: ['#28a745', '#ffc107', '#dc3545', '#6c757d']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function renderPriorityChart() {
            const priorityCounts = {};
            taskData.forEach(t => {
                priorityCounts[t.priority] = (priorityCounts[t.priority] || 0) + 1;
            });

            const ctx = document.getElementById('priorityChart').getContext('2d');
            if (charts.priority) charts.priority.destroy();
            
            charts.priority = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(priorityCounts),
                    datasets: [{
                        data: Object.values(priorityCounts),
                        backgroundColor: ['#dc3545', '#fd7e14', '#ffc107', '#28a745']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function renderOwnerChart() {
            const ownerCounts = {};
            taskData.forEach(t => {
                ownerCounts[t.owner] = (ownerCounts[t.owner] || 0) + 1;
            });

            const ctx = document.getElementById('ownerChart').getContext('2d');
            if (charts.owner) charts.owner.destroy();
            
            charts.owner = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(ownerCounts),
                    datasets: [{
                        label: 'Tasks',
                        data: Object.values(ownerCounts),
                        backgroundColor: '#667eea'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function renderProjectChart() {
            const projectData = {};
            taskData.forEach(t => {
                if (!projectData[t.project]) {
                    projectData[t.project] = [];
                }
                projectData[t.project].push(t.completion);
            });

            const avgByProject = Object.entries(projectData).map(([project, completions]) => ({
                project,
                avg: Math.round(completions.reduce((a, b) => a + b, 0) / completions.length)
            }));

            const ctx = document.getElementById('projectChart').getContext('2d');
            if (charts.project) charts.project.destroy();
            
            charts.project = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: avgByProject.map(p => p.project),
                    datasets: [{
                        label: 'Completion %',
                        data: avgByProject.map(p => p.avg),
                        backgroundColor: '#764ba2'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    }
                }
            });
        }

        function renderUrgentTasks(overdueTasks) {
            const critical = taskData.filter(t => t.priority === 'Critical');
            const urgent = [...new Set([...overdueTasks, ...critical])];

            const html = urgent.slice(0, 10).map(task => `
                <div class="task-item ${task.priority === 'Critical' ? 'critical' : ''} ${overdueTasks.includes(task) ? 'overdue' : ''}">
                    <div class="task-header">
                        <span class="task-name">${task.taskName}</span>
                        <span class="task-badge badge-${task.priority.toLowerCase()}">${task.priority}</span>
                    </div>
                    <div class="task-meta">
                        ${task.project} • ${task.owner} • Due: ${task.dueDate} • ${task.completion}% complete
                    </div>
                </div>
            `).join('');

            document.getElementById('urgentTasks').innerHTML = html || '<p>No critical or overdue tasks! 🎉</p>';
        }

        // Load from localStorage if available
        window.onload = () => {
            const saved = localStorage.getItem('dashboardConfig');
            if (saved) {
                const config = JSON.parse(saved);
                document.getElementById('spreadsheetId').value = config.spreadsheetId || '';
                document.getElementById('sheetName').value = config.sheetName || 'Sheet1';
                document.getElementById('apiKey').value = config.apiKey || '';
            }
        };

        // Save config on load
        function loadData() {
            const config = {
                spreadsheetId: document.getElementById('spreadsheetId').value,
                sheetName: document.getElementById('sheetName').value,
                apiKey: document.getElementById('apiKey').value
            };
            localStorage.setItem('dashboardConfig', JSON.stringify(config));
            
            // Original loadData logic continues...
            const spreadsheetId = config.spreadsheetId;
            const sheetName = config.sheetName;
            const apiKey = config.apiKey;

            if (!spreadsheetId || !apiKey) {
                alert('Please enter Spreadsheet ID and API Key');
                return;
            }

            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading data...</div>';

            fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${sheetName}!A:Z?key=${apiKey}`)
                .then(response => {
                    if (!response.ok) throw new Error(`Failed to fetch data: ${response.statusText}`);
                    return response.json();
                })
                .then(data => {
                    const rows = data.values;
                    if (!rows || rows.length < 2) throw new Error('No data found in sheet');

                    const headers = rows[0];
                    taskData = rows.slice(1).map(row => ({
                        taskId: row[0],
                        project: row[1],
                        taskName: row[2],
                        owner: row[3],
                        department: row[4],
                        priority: row[5],
                        status: row[6],
                        startDate: row[7],
                        dueDate: row[8],
                        completion: parseInt(row[9]) || 0
                    }));

                    renderDashboard();
                })
                .catch(error => {
                    content.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                });
        }
    </script>
</body>
</html>
